name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Gates the tsc error count at zero so it cannot grow silently again
      # (three files had accumulated pre-existing errors before this step existed).
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test