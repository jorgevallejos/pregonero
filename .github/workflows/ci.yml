name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm install (not npm ci) + no cache: works around npm's optional-deps
        # bug (#4828) that skips rolldown's platform-specific native binding
        # under the Vite 8 / Vitest 4 toolchain, which crashed vitest at startup.
        run: npm install --no-audit --no-fund

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test