name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Gates the tsc error count at zero so it cannot grow silently again
      # (three files had accumulated pre-existing errors before this step existed).
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # **CI did not build, and a broken `index.html` went green through it** (2026-09-06). The
      # source `index.html` was overwritten with Vite's built output — the same file name, a
      # different file — and lint, typecheck and the whole suite passed over it, because none of
      # them opens the app's entry point. `npm run build` is the only check that reads it, it takes
      # under a second, and it is the difference between finding that at the next `pack` and
      # finding it at the commit.
      - name: Build
        run: npm run build